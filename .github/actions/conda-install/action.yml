name: Install turtle dependencies via conda

inputs:
  python-version:
    description: Python version to install
    required: true
    type: string
    default: "3.12"

runs:
  using: composite
  steps:

    # 1. Modify the environment.yml FIRST, before micromamba reads it
    - name: Modify environment file
      run: |
        sed -i'' -e "s/python>3.7/python=${{ inputs.python-version }}/g" environment.yml
      shell: bash

    # 2. Setup Micromamba (this automatically creates and caches the env)
    - name: Setup Micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        environment-name: turtleFSI
        cache-environment: true
        cache-downloads: true

    # 3. Verify the environment
    - name: List environment
      run: micromamba list -n turtleFSI
      shell: bash -el {0}