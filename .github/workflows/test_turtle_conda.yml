name: Test turtle against FEniCS stable

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["master"]

env:
  DEB_PYTHON_INSTALL_LAYOUT: deb_system
  IPP_NONINTERACTIVE: "1"

defaults:
  run:
    # This is perfect! It ensures Micromamba activates the environment automatically.
    shell: bash -el {0}

jobs:
  test-conda:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4 # (Updated to standard v4, adjust if v7 is custom)

      - name: Install turtle dependencies via conda
        uses: ./.github/actions/conda-install
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install code
        run: python -m pip install --no-deps .

      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -xvs